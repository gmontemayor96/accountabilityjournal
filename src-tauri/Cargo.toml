[package]
name = "identity"
version = "0.1.0"
description = "Identity habit tracker"
edition = "2021"

[lib]
name = "identity_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-sql = { version = "~2.5", features = ["sqlite"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-dialog = "~2.8"
tauri-plugin-notification = "~2.5"
tauri-plugin-http = "~2.8"

